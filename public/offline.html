<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>لا يوجد اتصال بالإنترنت — عزاب موتو</title>
    <style>
      :root {
        --bg: #fffdf9;
        --surface: #ffffff;
        --border: #ece6dd;
        --accent: #ff8200;
        --heading: #2b2b2b;
        --body: #6b6560;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        background-color: var(--bg);
        color: var(--body);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 1.5rem;
        text-align: center;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 2.5rem 1.5rem;
        max-width: 440px;
        width: 100%;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.03);
      }
      .icon {
        width: 56px;
        height: 56px;
        margin: 0 auto 1.25rem;
        border-radius: 50%;
        background: #fff3e6;
        color: var(--accent);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
      }
      h1 {
        font-size: 1.35rem;
        color: var(--heading);
        margin-bottom: 0.75rem;
      }
      p {
        font-size: 0.95rem;
        line-height: 1.6;
        margin-bottom: 1.5rem;
      }
      .btn {
        display: inline-block;
        background: var(--accent);
        color: #fff;
        padding: 0.75rem 1.75rem;
        border-radius: 10px;
        text-decoration: none;
        font-weight: bold;
        font-size: 0.95rem;
        border: none;
        cursor: pointer;
        transition: opacity 0.15s ease;
      }
      .btn:hover {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">⚡</div>
      <h1>أنت غير متصل بالإنترنت</h1>
      <p>
        يبدو أن اتصال الإنترنت انقطع. يرجى التحقق من الشبكة ثم إعادة المحاولة لتصفح قطع غيار TVS.
      </p>
      <button class="btn" onclick="window.location.reload()">إعادة المحاولة</button>
    </div>
  </body>
</html>
