openapi: 3.1.0
info:
  title: AZZAB MOTO REST API
  description: Official REST API specification for AZZAB MOTO TVS motorcycle spare parts e-commerce and admin management.
  version: 1.1.0
servers:
  - url: /api
    description: Current host API root

paths:
  /products:
    get:
      summary: List catalog products (Public, excludes soft-deleted products)
      tags: [Public Products]
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: perPage
          in: query
          schema:
            type: integer
            default: 20
        - name: categoryId
          in: query
          schema:
            type: string
        - name: modelId
          in: query
          schema:
            type: string
        - name: year
          in: query
          schema:
            type: integer
        - name: q
          in: query
          description: Search term
          schema:
            type: string
        - name: availability
          in: query
          schema:
            type: string
            enum: [in_stock, out_of_stock, order_only]
        - name: sort
          in: query
          schema:
            type: string
            enum: [price_asc, price_desc, latest, name_asc]
      responses:
        '200':
          description: Paginated product list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProducts'

  /products/{slug}:
    get:
      summary: Get single product by slug
      tags: [Public Products]
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Product details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /categories:
    get:
      summary: List all active categories
      tags: [Public Categories]
      responses:
        '200':
          description: Category list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'

  /models:
    get:
      summary: List all motorcycle models
      tags: [Public Vehicles]
      responses:
        '200':
          description: Model list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Model'

  /orders:
    post:
      summary: Submit a Cash-on-Delivery customer order (Rate limited: 10/hour/IP)
      tags: [Public Orders]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderConfirmation'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Stock conflict or out of stock
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: Rate limited

  /orders/lookup:
    post:
      summary: Lookup order status by order number and phone (POST with JSON body to protect PII; Rate limited: 10/min/IP)
      tags: [Public Orders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderLookupRequest'
      responses:
        '200':
          description: Order lookup result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderLookupResult'
        '404':
          description: Order not found (generic message to prevent phone enumeration)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: Rate limited

  /auth/csrf-token:
    get:
      summary: Fetch CSRF token for mutating requests
      tags: [Authentication]
      responses:
        '200':
          description: CSRF token
          content:
            application/json:
              schema:
                type: object
                properties:
                  csrfToken:
                    type: string
                required: [csrfToken]

  /auth/login:
    post:
      summary: Authenticate staff member (Rate limited: 5 failed attempts / 15 mins)
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Logged in successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: Rate limited (includes Retry-After header)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /auth/logout:
    post:
      summary: Log out and clear session cookie
      tags: [Authentication]
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  /auth/me:
    get:
      summary: Get currently logged in user info
      tags: [Authentication]
      security:
        - cookieAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthenticated

  /auth/change-password:
    post:
      summary: Change own password (clears mustChangePassword flag)
      tags: [Authentication]
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string

  /admin/dashboard:
    get:
      summary: Fetch dashboard KPIs and order counts (Roles: admin, orders_manager)
      tags: [Admin Dashboard]
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDashboardSummary'

  /admin/orders:
    get:
      summary: List all orders with filters (Roles: admin, orders_manager)
      tags: [Admin Orders]
      security:
        - cookieAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: perPage
          in: query
          schema:
            type: integer
            default: 20
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/OrderStatus'
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          schema:
            type: string
            format: date
        - name: governorate
          in: query
          schema:
            type: string
        - name: q
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminOrders'

  /admin/orders/{id}:
    get:
      summary: Get full order details and audit history (Roles: admin, orders_manager)
      tags: [Admin Orders]
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrderDetail'

  /admin/orders/{id}/status:
    patch:
      summary: Update order status (Roles: admin, orders_manager)
      tags: [Admin Orders]
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  $ref: '#/components/schemas/OrderStatus'
                note:
                  type: string
              required: [status]
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrderDetail'
        '400':
          description: Invalid status transition

  /admin/orders/export/csv:
    get:
      summary: Export orders as CSV (Role: admin ONLY)
      tags: [Admin Orders]
      security:
        - cookieAuth: []
      responses:
        '200':
          description: CSV file download
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '403':
          description: Forbidden for orders_manager

  /admin/products:
    get:
      summary: Admin products listing with stock counts (Roles: admin, orders_manager)
      tags: [Admin Products]
      security:
        - cookieAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: perPage
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated product items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProducts'
    post:
      summary: Create a new product (Role: admin ONLY)
      tags: [Admin Products]
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductInput'
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '403':
          description: Forbidden for orders_manager

  /admin/products/{id}:
    get:
      summary: Get single product by ID for admin editor (Roles: admin, orders_manager)
      tags: [Admin Products]
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Product details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
    patch:
      summary: Update a product or soft-delete with isActive=false (Role: admin ONLY)
      tags: [Admin Products]
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductInput'
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '403':
          description: Forbidden for orders_manager

  /admin/products/{id}/images:
    post:
      summary: Upload product images (Role: admin ONLY)
      tags: [Admin Products]
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        '201':
          description: Images uploaded
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '403':
          description: Forbidden for orders_manager

  /admin/products/{id}/images/{imageId}:
    delete:
      summary: Delete a single product image (Role: admin ONLY)
      tags: [Admin Products]
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: imageId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Image deleted
        '403':
          description: Forbidden for orders_manager

  /admin/products/{id}/images/reorder:
    put:
      summary: Reorder product images and set primary image (Role: admin ONLY)
      tags: [Admin Products]
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderImagesRequest'
      responses:
        '200':
          description: Images reordered
        '403':
          description: Forbidden for orders_manager

  /admin/categories:
    get:
      summary: List all categories for admin (Roles: admin, orders_manager)
      tags: [Admin Categories]
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Category list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
    post:
      summary: Create a category (Role: admin ONLY)
      tags: [Admin Categories]
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryInput'
      responses:
        '201':
          description: Category created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '403':
          description: Forbidden for orders_manager

  /admin/categories/{id}:
    patch:
      summary: Update a category (Role: admin ONLY)
      tags: [Admin Categories]
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoryInput'
      responses:
        '200':
          description: Category updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '403':
          description: Forbidden for orders_manager
    delete:
      summary: Delete a category (Role: admin ONLY; blocked with 409 if products exist)
      tags: [Admin Categories]
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Category deleted
        '403':
          description: Forbidden for orders_manager
        '409':
          description: Category not empty
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /admin/categories/reorder:
    put:
      summary: Reorder store categories sequence (Role: admin ONLY)
      tags: [Admin Categories]
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderCategoriesRequest'
      responses:
        '200':
          description: Categories reordered
        '403':
          description: Forbidden for orders_manager

  /admin/users:
    get:
      summary: List staff users (Role: admin ONLY)
      tags: [Admin Users]
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Staff list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '403':
          description: Forbidden for orders_manager
    post:
      summary: Create an orders_manager user with temporary password (Role: admin ONLY)
      tags: [Admin Users]
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserInput'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateUserResponse'
        '403':
          description: Forbidden for orders_manager

  /admin/users/{id}/disable:
    patch:
      summary: Disable a user account (Role: admin ONLY)
      tags: [Admin Users]
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User disabled
        '403':
          description: Forbidden for orders_manager

  /admin/users/{id}/enable:
    patch:
      summary: Re-enable a disabled user account (Role: admin ONLY)
      tags: [Admin Users]
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User enabled
        '403':
          description: Forbidden for orders_manager

  /admin/users/{id}/reset-password:
    post:
      summary: Admin resets user password and generates temporary password with mustChangePassword=true (Role: admin ONLY)
      tags: [Admin Users]
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Password reset successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetPasswordResponse'
        '403':
          description: Forbidden for orders_manager

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session_id

  schemas:
    OrderStatus:
      type: string
      enum: [new, processing, shipped, delivered, cancelled]

    UserRole:
      type: string
      enum: [admin, orders_manager]

    MoneyString:
      type: string
      pattern: '^\d+\.\d{2}$'
      example: '380.00'

    ApiError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        fieldErrors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      required: [code, message]

    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
        perPage:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
      required: [page, perPage, total, totalPages]

    Compatibility:
      type: object
      properties:
        modelId:
          type: string
        yearFrom:
          type: integer
        yearTo:
          type: integer
      required: [modelId, yearFrom, yearTo]

    Product:
      type: object
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string
        nameEn:
          type: string
        sku:
          type: string
        partNumber:
          type: string
        categoryId:
          type: string
        price:
          $ref: '#/components/schemas/MoneyString'
        currency:
          type: string
          default: EGP
        availability:
          type: string
          enum: [in_stock, out_of_stock, order_only]
        stockQuantity:
          type: integer
          nullable: true
        isActive:
          type: boolean
          default: true
        images:
          type: array
          items:
            type: string
        description:
          type: string
        compatibility:
          type: array
          items:
            $ref: '#/components/schemas/Compatibility'
      required: [id, slug, name, nameEn, sku, categoryId, price, currency, availability, images, description]

    PaginatedProducts:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
      required: [data, meta]

    Category:
      type: object
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string
        icon:
          type: string
        description:
          type: string
        productCount:
          type: integer
      required: [id, slug, name, icon]

    Model:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        nameAr:
          type: string
        years:
          type: array
          items:
            type: integer
        imageUrl:
          type: string
      required: [id, name, years]

    CustomerInput:
      type: object
      properties:
        name:
          type: string
        phone:
          type: string
          pattern: '^01[0125]\d{8}$'
        governorate:
          type: string
        city:
          type: string
        address:
          type: string
        notes:
          type: string
      required: [name, phone, governorate, city, address]

    OrderItemInput:
      type: object
      properties:
        productId:
          type: string
        quantity:
          type: integer
          minimum: 1
      required: [productId, quantity]

    CreateOrderRequest:
      type: object
      properties:
        customer:
          $ref: '#/components/schemas/CustomerInput'
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemInput'
          minItems: 1
        honeypotField:
          type: string
      required: [customer, items]

    OrderConfirmationItem:
      type: object
      properties:
        productId:
          type: string
        productName:
          type: string
        price:
          $ref: '#/components/schemas/MoneyString'
        quantity:
          type: integer
        total:
          $ref: '#/components/schemas/MoneyString'
      required: [productId, productName, price, quantity, total]

    OrderConfirmation:
      type: object
      properties:
        orderNumber:
          type: string
        status:
          $ref: '#/components/schemas/OrderStatus'
        total:
          $ref: '#/components/schemas/MoneyString'
        subtotal:
          $ref: '#/components/schemas/MoneyString'
        shippingFee:
          $ref: '#/components/schemas/MoneyString'
        currency:
          type: string
          default: EGP
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderConfirmationItem'
        customer:
          $ref: '#/components/schemas/CustomerInput'
        createdAt:
          type: string
          format: date-time
      required: [orderNumber, status, total, subtotal, shippingFee, currency, items, customer, createdAt]

    OrderLookupRequest:
      type: object
      properties:
        orderNumber:
          type: string
        phone:
          type: string
          pattern: '^01[0125]\d{8}$'
      required: [orderNumber, phone]

    OrderLookupResult:
      type: object
      properties:
        orderNumber:
          type: string
        status:
          $ref: '#/components/schemas/OrderStatus'
        createdAt:
          type: string
          format: date-time
        statusUpdatedAt:
          type: string
          format: date-time
        total:
          $ref: '#/components/schemas/MoneyString'
        itemsCount:
          type: integer
        governorate:
          type: string
      required: [orderNumber, status, createdAt, total, itemsCount, governorate]

    LoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required: [username, password]

    User:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        name:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        disabled:
          type: boolean
        mustChangePassword:
          type: boolean
      required: [id, username, name, role]

    AuthSession:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
      required: [user]

    ChangePasswordRequest:
      type: object
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8
      required: [currentPassword, newPassword]

    AdminDashboardSummary:
      type: object
      properties:
        todayOrdersCount:
          type: integer
        todayOrdersTotal:
          $ref: '#/components/schemas/MoneyString'
        pendingOrdersCount:
          type: integer
        lowStockCount:
          type: integer
        statusCounts:
          type: object
          properties:
            new:
              type: integer
            processing:
              type: integer
            shipped:
              type: integer
            delivered:
              type: integer
            cancelled:
              type: integer
          required: [new, processing, shipped, delivered, cancelled]
      required: [todayOrdersCount, todayOrdersTotal, pendingOrdersCount, lowStockCount, statusCounts]

    AdminOrderSummary:
      type: object
      properties:
        id:
          type: string
        orderNumber:
          type: string
        customerName:
          type: string
        phone:
          type: string
        governorate:
          type: string
        status:
          $ref: '#/components/schemas/OrderStatus'
        total:
          $ref: '#/components/schemas/MoneyString'
        itemsCount:
          type: integer
        createdAt:
          type: string
          format: date-time
      required: [id, orderNumber, customerName, phone, governorate, status, total, itemsCount, createdAt]

    PaginatedAdminOrders:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdminOrderSummary'
